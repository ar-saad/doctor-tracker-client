<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The app mark: the same stethoscope the sidebar and login page show, on the
       brand tile. Hard-coded #00809e is the sRGB of the --primary oklch in
       globals.css — a standalone icon file cannot read the app's CSS variables.

       Named icon.svg because that is a Next.js metadata file convention: the
       framework emits the <link rel="icon"> for it, so nothing has to be wired
       up in layout.tsx. -->
  <rect width="32" height="32" rx="7" fill="#00809e"/>
  <g transform="translate(4 4)" fill="none" stroke="#ffffff" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 2v2"/>
    <path d="M5 2v2"/>
    <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/>
    <path d="M8 15a6 6 0 0 0 12 0v-3"/>
    <circle cx="20" cy="10" r="2"/>
  </g>
</svg>
